<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nhập khách hàng | CustomerHub</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="topbar"><a class="brand" href="/">Customer<span>Hub</span></a><nav><a class="active" href="/">Nhập thông tin</a><a href="/customers.html">Danh sách</a></nav></header>
<main><p class="eyebrow">Hồ sơ khách hàng</p><h1 id="page-title">Thêm thông tin khách hàng</h1><p class="subtitle" id="page-subtitle">Điền đầy đủ các trường dưới đây. Thông tin sẽ được lưu vào MongoDB.</p>
<section class="card"><form id="customer-form"><div class="form-grid"><div class="field"><label for="firstName">First name</label><input id="firstName" name="firstName" autocomplete="given-name" required placeholder="Ví dụ: Minh"></div><div class="field"><label for="lastName">Last name</label><input id="lastName" name="lastName" autocomplete="family-name" required placeholder="Ví dụ: Nguyễn"></div><div class="field"><label for="customerId">ID</label><input id="customerId" name="customerId" required placeholder="Ví dụ: KH-001"></div><div class="field"><label for="dateOfBirth">Date of birth</label><input id="dateOfBirth" name="dateOfBirth" type="date" required></div><div class="field full"><label for="balance">Balance</label><input id="balance" name="balance" type="number" min="0" step="0.01" inputmode="decimal" required placeholder="0.00"><p class="hint">Số dư không được nhỏ hơn 0.</p></div></div><div class="actions"><button class="button" type="submit">Lưu khách hàng</button><a id="cancel-edit" class="text-link hidden" href="/customers.html">Huỷ chỉnh sửa</a><p id="message" class="message" aria-live="polite"></p></div></form></section><section id="event-history" class="history hidden"><h2>Lịch sử Event</h2><p>Event mới nhất ở trên cùng. Form đang hiển thị trạng thái được dựng từ event mới nhất.</p><div id="event-list"></div></section></main><script src="/form.js"></script></body></html>
