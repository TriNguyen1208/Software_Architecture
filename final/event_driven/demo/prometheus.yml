global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:9464']

  - job_name: 'inventory-service'
    static_configs:
      - targets: ['inventory-service:9464']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:9464']
